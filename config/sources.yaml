# Where InternRadar looks. Every source is the public endpoint a company's own careers page uses.
# Add or remove boards freely: a board that fails is logged and skipped without stopping the run,
# and its postings are never marked closed on a failed check.
#
# Verification: on 2026-09-29 every board below answered its list endpoint (checked from a browser).
# That shows the configuration is right; it is not a guarantee a board will keep working.
# Re-check any time with:  python -m radar.pipeline check

