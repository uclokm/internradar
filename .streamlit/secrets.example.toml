# InternRadar secrets. Copy to .streamlit/secrets.toml locally (git-ignored),
# or paste into Streamlit Cloud > App settings > Secrets. Never commit real values.

# Optional: a password for the hosted app
APP_PASSWORD = "choose-a-password"

# Your master CV: the full contents of config/master_cv.yaml. Keeps contact details out of git.
MASTER_CV = """
name: YOUR NAME
contact: "City | you@example.com"
# ...paste the rest of your config/master_cv.yaml here...
"""

# Optional: save application statuses and hand-added roles from the hosted app to a
# SEPARATE PRIVATE repo. Use a fine-grained token with "Contents: read and write" on that repo only.
# GITHUB_TOKEN = "github_pat_..."
# GITHUB_REPO  = "your-username/internradar-private-data"
